[package]
name = "hy2panel"
version = "1.0.0"
edition = "2021"
description = "User management panel for Hysteria2: HTTP auth backend, traffic quotas, expiry, device limits and per-user sing-box subscriptions"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "alloc"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
anyhow = "1"

[profile.release]
strip = true
opt-level = 2
